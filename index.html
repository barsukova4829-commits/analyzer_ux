      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

/\n@font-face {\n  font-family: 'Onest';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"4cb8c204-9099-4262-b02f-9d315a691051\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Onest';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"4aa5d8e4-f6ec-4f02-83b7-2db212018ba1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html{scroll-behavior:smooth}\n  body{margin:0;font-family:'Onest',sans-serif;-webkit-font-smoothing:antialiased;color:#141712;background:#fff}\n  ::selection{background:#0f3d1e;color:#fff}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"top\" style=\"--grn:#3ddc5a;--grn-deep:#1f8a3a;--ink:#141712;--ink2:#43483f;--ink3:#7c8274;--line:#e7ebe3;--paper:#f6f8f3;--bug:#f2a93b;--idea:#5b9bf0;--complaint:#ef6a52;--praise:#1f8a3a;width:100%;overflow-x:hidden\">\n\n  <!-- NAV -->\n  <div style=\"display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:0 auto;padding:28px 40px 0\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <div style=\"width:36px;height:36px;border-radius:10px;background:var(--ink);display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:9px;position:relative;flex:none\">\n        <div style=\"width:4px;height:9px;border-radius:2px;background:var(--grn);opacity:.75\"><\u002Fdiv>\n        <div style=\"width:4px;height:14px;border-radius:2px;background:var(--grn);opacity:.9\"><\u002Fdiv>\n        <div style=\"width:4px;height:20px;border-radius:2px;background:var(--grn)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:17px;font-weight:800;letter-spacing:-.02em\">Анализатор обратной связи<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3);padding-left:2px\">· команда Шоппера<\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"#closing\" style=\"border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14.5px;font-weight:700;padding:11px 20px;border-radius:100px;cursor:pointer;text-decoration:none\">Обсудить внедрение<\u002Fa>\n  <\u002Fdiv>\n\n  <!-- HERO -->\n  <div style=\"position:relative;max-width:1240px;margin:36px auto 0;padding:0 40px\">\n    <div style=\"position:relative;border-radius:32px;overflow:hidden;background:radial-gradient(120% 140% at 15% 0%, #6bf08a 0%, var(--grn) 42%, var(--grn-deep) 100%);padding:72px 64px 64px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n\n      <span style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.14);color:#0e2f16;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;border-radius:100px;margin-bottom:28px\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#0e2f16\"><\u002Fspan>\n        Внутренний инструмент для анализа обратной связи\n      <\u002Fspan>\n\n      <h1 style=\"margin:0;font-size:58px;line-height:1.08;font-weight:900;letter-spacing:-.03em;color:var(--ink);max-width:760px\">UXFB ANALYZER<\u002Fh1>\n\n      <p style=\"margin:26px 0 0;font-size:18px;line-height:1.55;color:#0e2f16;max-width:620px;font-weight:500\">Загружаете выгрузку — получаете отчёт.<br>ANALYZER автоматически убирает персональные данные, раскладывает отзывы по типу и теме и присылает готовые рекомендации.<\u002Fp>\n\n      <div style=\"display:flex;gap:14px;margin-top:36px\">\n        <a href=\"#pipeline\" style=\"border:none;background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:16px 30px;border-radius:100px;cursor:pointer;text-decoration:none\">Смотреть, как это работает<\u002Fa>\n        <a href=\"#mock\" style=\"border:2px solid rgba(0,0,0,.18);background:transparent;color:var(--ink);font-size:16px;font-weight:700;padding:14px 28px;border-radius:100px;cursor:pointer;text-decoration:none\">Пример отчёта<\u002Fa>\n      <\u002Fdiv>\n\n      <!-- signature: live sorting demo -->\n      <div style=\"position:relative;margin-top:52px;width:100%;max-width:980px;background:#fff;border-radius:20px;box-shadow:0 30px 60px rgba(10,40,15,.28);padding:28px 30px;text-align:left;display:grid;grid-template-columns:1fr 1px 1.1fr;gap:26px\">\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)\">СЫРЫЕ ОТЗЫВЫ ИЗ UXFB<\u002Fspan>\n          <sc-for list=\"{{ incoming }}\" as=\"item\" hint-placeholder-count=\"5\">\n            <div style=\"position:relative;background:var(--paper);border:1.5px solid {{ item.borderColor }};border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.5;color:{{ item.textColor }}\">\n              {{ item.text }}\n              <sc-if value=\"{{ item.tagging }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute;top:-10px;right:12px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;color:#141712;background:{{ item.tagColor }}\">{{ item.tagLabel }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--line)\"><\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)\">РАЗЛОЖЕНЫ ПО ТЕМАМ<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <sc-for list=\"{{ buckets }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--paper);border-radius:12px;padding:15px 16px;border-top:3px solid {{ b.color }};box-shadow:{{ b.glow }};display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3)\">{{ b.label }}<\u002Fspan>\n                <span style=\"font-size:27px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums\">{{ b.count }}<\u002Fspan>\n                <div style=\"display:flex;flex-wrap:wrap;gap:4px;min-height:8px\">\n                  <sc-for list=\"{{ b.chips }}\" as=\"chip\" hint-placeholder-count=\"0\">\n                    <span style=\"width:6px;height:6px;border-radius:50%;background:{{ b.color }};opacity:.75\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- WHY THIS MATTERS -->\n  <div style=\"max-width:1240px;margin:100px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:44px;max-width:680px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">Зачем это нужно<\u002Fspan>\n      <h2 style=\"margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Что такое UX-Feedback и как с ним работать.<\u002Fh2><p style=\"margin:0;font-size:16.5px;line-height:1.55;color:var(--ink2)\">UX-Feedback - это инструмент сбора обратной связи от курьеров и сборщиков прямо в приложении: после определённого события пользователю показывается короткий опросник с оценкой и открытым вопросом.<\u002Fp>\n      \n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden\">\n      <div style=\"background:#fff;padding:38px 36px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)\">— Раньше<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink3)\">Тысячи отзывов копились в UX-feedback — без обработки<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink3)\">Не использовался как источник настроения курьеров и сборщиков<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink3)\">Боли и хорошие идеи тонули в общем потоке<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink3)\">Не хватало времени для разбора вручную<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:linear-gradient(180deg, rgba(61,220,90,.08), transparent);padding:38px 36px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grn-deep)\">— С Анализатором<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--grn-deep);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink)\">Каждый отзыв прочитан и классифицирован автоматически<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--grn-deep);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink)\">Видно настроение курьеров и сборщиков по каждой кампании<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--grn-deep);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink)\">Боли выявлены и расставлены по приоритету<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:var(--grn-deep);margin-top:7px;flex:none\"><\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:var(--ink)\">Идеи пользователей собраны и готовы лечь в бэклог<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HOW TO USE -->\n  <div id=\"howto\" style=\"max-width:1240px;margin:130px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:44px;max-width:680px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">С чего начать<\u002Fspan>\n      <h2 style=\"margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Как пользоваться анализатором<\u002Fh2>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.55;color:var(--ink2)\">Весь путь — два шага: скачать выгрузку с отзывами из UX-Feedback и загрузить её в анализатор. Дальше всё происходит автоматически, вручную ничего размечать не нужно.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden\">\n\n      <!-- STEP 1: download from UX-Feedback -->\n      <div style=\"background:#fff;padding:38px 36px;display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:15px;flex:none\">1<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Скачать таблицу из UX-Feedback<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)\">платформа ux-feedback<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">01<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Войдите в аккаунт UX-Feedback и откройте нужный проект.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">02<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Выберите опрос (кампанию), отзывы по которому хотите разобрать.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">03<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Перейдите в раздел <b style=\"color:var(--ink)\">«Ответы»<\u002Fb> и при необходимости задайте период и фильтры.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">04<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Нажмите <b style=\"color:var(--ink)\">«Экспорт»<\u002Fb> и выберите формат <b style=\"color:var(--ink)\">Excel (XLSX)<\u002Fb> — файл скачается в браузер.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:auto;background:var(--paper);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5;color:var(--ink2)\">\n          Ничего дополнительно чистить не нужно — анализатор сам найдёт колонку с текстом отзыва и удалит персональные данные.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- STEP 2: use the analyzer -->\n      <div style=\"background:linear-gradient(180deg, rgba(61,220,90,.08), transparent);padding:38px 36px;display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"width:34px;height:34px;border-radius:50%;background:var(--grn-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:15px;flex:none\">2<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Загрузить в анализатор<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)\">uxfb analyzer<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">01<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Откройте анализатор по кнопке <b style=\"color:var(--ink)\">«Попробовать»<\u002Fb> ниже.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">02<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Перетащите скачанный <b style=\"color:var(--ink)\">XLSX-файл<\u002Fb> в окно загрузки или выберите его вручную.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">03<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Запустите обработку и дождитесь, пока модель классифицирует отзывы.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);margin-top:2px;flex:none\">04<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.55;color:var(--ink2)\">Изучите отчёт на экране и при необходимости скачайте <b style=\"color:var(--ink)\">PDF<\u002Fb> или размеченную <b style=\"color:var(--ink)\">CSV-таблицу<\u002Fb>.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5;color:var(--ink2)\">\n          Обработка идёт на внутренней модели — выгрузка с отзывами наружу не уходит.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FULL FLOW WITH ILLUSTRATIONS -->\n  <div id=\"flow\" style=\"max-width:1240px;margin:130px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:48px;max-width:680px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">Полный путь<\u002Fspan>\n      <h2 style=\"margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">От запуска кампании до готового отчёта<\u002Fh2>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.55;color:var(--ink2)\">Шесть экранов — весь маршрут: настроить опрос в UX-Feedback, собрать ответы, выгрузить таблицу и получить разобранный отчёт в анализаторе.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n\n      <!-- 1. Create campaign -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px\">\n        <div style=\"position:relative\">\n          <svg viewBox=\"0 0 320 176\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n            <rect x=\"1\" y=\"1\" width=\"318\" height=\"174\" rx=\"14\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <circle cx=\"20\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"32\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"44\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/>\n            <line x1=\"0\" y1=\"34\" x2=\"320\" y2=\"34\" stroke=\"#eef1ea\"/>\n            <text x=\"20\" y=\"58\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#7c8274\">НОВАЯ КАМПАНИЯ<\u002Ftext>\n            <rect x=\"20\" y=\"66\" width=\"220\" height=\"11\" rx=\"5.5\" fill=\"#eef1ea\"/>\n            <g fill=\"#3ddc5a\">\n              <path transform=\"translate(30,104)\" d=\"M0,-7 L2.02,-2.16 L6.66,-2.16 L2.92,0.82 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.92,0.82 L-6.66,-2.16 L-2.02,-2.16 Z\"/>\n              <path transform=\"translate(52,104)\" d=\"M0,-7 L2.02,-2.16 L6.66,-2.16 L2.92,0.82 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.92,0.82 L-6.66,-2.16 L-2.02,-2.16 Z\"/>\n              <path transform=\"translate(74,104)\" d=\"M0,-7 L2.02,-2.16 L6.66,-2.16 L2.92,0.82 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.92,0.82 L-6.66,-2.16 L-2.02,-2.16 Z\"/>\n              <path transform=\"translate(96,104)\" d=\"M0,-7 L2.02,-2.16 L6.66,-2.16 L2.92,0.82 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.92,0.82 L-6.66,-2.16 L-2.02,-2.16 Z\"/>\n              <path transform=\"translate(118,104)\" fill=\"#e7ebe3\" d=\"M0,-7 L2.02,-2.16 L6.66,-2.16 L2.92,0.82 L4.11,5.66 L0,2.8 L-4.11,5.66 L-2.92,0.82 L-6.66,-2.16 L-2.02,-2.16 Z\"/>\n            <\u002Fg>\n            <rect x=\"20\" y=\"124\" width=\"200\" height=\"30\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n            <rect x=\"34\" y=\"136\" width=\"120\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n            <rect x=\"230\" y=\"124\" width=\"70\" height=\"30\" rx=\"8\" fill=\"#141712\"/>\n            <text x=\"265\" y=\"143\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#3ddc5a\">Пуск<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px\">1<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px\">Запустить кампанию<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)\">В UX-Feedback создаёте опрос: оценка + открытый вопрос, выбираете триггер и аудиторию, включаете кампанию.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 2. Collect responses -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px\">\n        <div style=\"position:relative\">\n          <svg viewBox=\"0 0 320 176\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n            <rect x=\"1\" y=\"1\" width=\"318\" height=\"174\" rx=\"14\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <circle cx=\"20\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"32\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"44\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/>\n            <line x1=\"0\" y1=\"34\" x2=\"320\" y2=\"34\" stroke=\"#eef1ea\"/>\n            <text x=\"20\" y=\"56\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#7c8274\">ОТВЕТЫ ПОСТУПАЮТ<\u002Ftext>\n            <g>\n              <rect x=\"20\" y=\"66\" width=\"180\" height=\"26\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n              <circle cx=\"34\" cy=\"79\" r=\"6\" fill=\"#3ddc5a\" opacity=\".35\"/>\n              <rect x=\"48\" y=\"73\" width=\"120\" height=\"5\" rx=\"2.5\" fill=\"#e2e6dd\"/>\n              <rect x=\"48\" y=\"82\" width=\"80\" height=\"5\" rx=\"2.5\" fill=\"#eef1ea\"/>\n              <rect x=\"20\" y=\"98\" width=\"180\" height=\"26\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n              <circle cx=\"34\" cy=\"111\" r=\"6\" fill=\"#5b9bf0\" opacity=\".35\"/>\n              <rect x=\"48\" y=\"105\" width=\"110\" height=\"5\" rx=\"2.5\" fill=\"#e2e6dd\"/>\n              <rect x=\"48\" y=\"114\" width=\"70\" height=\"5\" rx=\"2.5\" fill=\"#eef1ea\"/>\n              <rect x=\"20\" y=\"130\" width=\"180\" height=\"26\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n              <circle cx=\"34\" cy=\"143\" r=\"6\" fill=\"#f2a93b\" opacity=\".35\"/>\n              <rect x=\"48\" y=\"137\" width=\"130\" height=\"5\" rx=\"2.5\" fill=\"#e2e6dd\"/>\n              <rect x=\"48\" y=\"146\" width=\"90\" height=\"5\" rx=\"2.5\" fill=\"#eef1ea\"/>\n            <\u002Fg>\n            <rect x=\"216\" y=\"66\" width=\"84\" height=\"90\" rx=\"12\" fill=\"#0e2f16\"/>\n            <text x=\"258\" y=\"108\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"22\" font-weight=\"700\" fill=\"#3ddc5a\">1 733<\u002Ftext>\n            <text x=\"258\" y=\"126\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"8\" fill=\"#8fd7a3\">ОТЗЫВОВ<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px\">2<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px\">Собрать ответы<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)\">Курьеры и сборщики отвечают прямо в приложении. Ответы копятся в кабинете кампании.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 3. Export XLSX -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px\">\n        <div style=\"position:relative\">\n          <svg viewBox=\"0 0 320 176\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n            <rect x=\"1\" y=\"1\" width=\"318\" height=\"174\" rx=\"14\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <circle cx=\"20\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"32\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"44\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/>\n            <line x1=\"0\" y1=\"34\" x2=\"320\" y2=\"34\" stroke=\"#eef1ea\"/>\n            <text x=\"20\" y=\"56\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#7c8274\">РАЗДЕЛ «ОТВЕТЫ»<\u002Ftext>\n            <g stroke=\"#e7ebe3\">\n              <rect x=\"20\" y=\"66\" width=\"180\" height=\"88\" rx=\"8\" fill=\"#f6f8f3\"/>\n              <line x1=\"20\" y1=\"88\" x2=\"200\" y2=\"88\"/><line x1=\"20\" y1=\"110\" x2=\"200\" y2=\"110\"/><line x1=\"20\" y1=\"132\" x2=\"200\" y2=\"132\"/>\n              <line x1=\"80\" y1=\"66\" x2=\"80\" y2=\"154\"/><line x1=\"140\" y1=\"66\" x2=\"140\" y2=\"154\"/>\n            <\u002Fg>\n            <rect x=\"26\" y=\"72\" width=\"40\" height=\"8\" rx=\"4\" fill=\"#1f8a3a\" opacity=\".5\"/>\n            <rect x=\"86\" y=\"72\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#1f8a3a\" opacity=\".5\"/>\n            <rect x=\"146\" y=\"72\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#1f8a3a\" opacity=\".5\"/>\n            <rect x=\"26\" y=\"95\" width=\"44\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/><rect x=\"86\" y=\"95\" width=\"40\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/><rect x=\"146\" y=\"95\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n            <rect x=\"26\" y=\"117\" width=\"40\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/><rect x=\"86\" y=\"117\" width=\"44\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/><rect x=\"146\" y=\"117\" width=\"34\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n            <rect x=\"26\" y=\"139\" width=\"46\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/><rect x=\"86\" y=\"139\" width=\"36\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/><rect x=\"146\" y=\"139\" width=\"42\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n            <rect x=\"216\" y=\"84\" width=\"86\" height=\"54\" rx=\"12\" fill=\"#3ddc5a\"/>\n            <path d=\"M259,98 L259,116 M251,109 L259,117 L267,109\" stroke=\"#0e2f16\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/>\n            <text x=\"259\" y=\"132\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#0e2f16\">XLSX<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px\">3<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px\">Скачать выгрузку<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)\">В разделе «Ответы» задаёте период и жмёте «Экспорт» → формат Excel (XLSX). Файл падает в браузер.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 4. Upload to analyzer -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px\">\n        <div style=\"position:relative\">\n          <svg viewBox=\"0 0 320 176\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n            <rect x=\"1\" y=\"1\" width=\"318\" height=\"174\" rx=\"14\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <circle cx=\"20\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"32\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"44\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/>\n            <line x1=\"0\" y1=\"34\" x2=\"320\" y2=\"34\" stroke=\"#eef1ea\"/>\n            <text x=\"20\" y=\"56\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#7c8274\">UXFB ANALYZER<\u002Ftext>\n            <rect x=\"20\" y=\"66\" width=\"280\" height=\"90\" rx=\"12\" fill=\"#f6f8f3\" stroke=\"#3ddc5a\" stroke-width=\"2\" stroke-dasharray=\"7 6\"/>\n            <rect x=\"132\" y=\"82\" width=\"40\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <path d=\"M160,82 L160,96 L172,96\" fill=\"none\" stroke=\"#e7ebe3\"/>\n            <path d=\"M160,82 L172,96\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <text x=\"151\" y=\"118\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"8\" font-weight=\"700\" fill=\"#1f8a3a\">XLSX<\u002Ftext>\n            <path d=\"M152,74 L152,60 M145,67 L152,60 L159,67\" stroke=\"#1f8a3a\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/>\n            <text x=\"160\" y=\"146\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"9\" fill=\"#7c8274\">перетащите файл сюда<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:var(--grn-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px\">4<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px\">Загрузить в анализатор<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)\">Открываете анализатор и перетаскиваете XLSX в окно загрузки. Колонки определятся автоматически.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 5. Classification -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px\">\n        <div style=\"position:relative\">\n          <svg viewBox=\"0 0 320 176\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n            <rect x=\"1\" y=\"1\" width=\"318\" height=\"174\" rx=\"14\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <circle cx=\"20\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"32\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"44\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/>\n            <line x1=\"0\" y1=\"34\" x2=\"320\" y2=\"34\" stroke=\"#eef1ea\"/>\n            <text x=\"20\" y=\"56\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#7c8274\">КЛАССИФИКАЦИЯ · QWEN 3.5<\u002Ftext>\n            <g>\n              <rect x=\"20\" y=\"66\" width=\"280\" height=\"24\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n              <rect x=\"32\" y=\"74\" width=\"150\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n              <rect x=\"228\" y=\"71\" width=\"60\" height=\"14\" rx=\"7\" fill=\"#ef6a52\"/><text x=\"258\" y=\"81\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"8\" fill=\"#fff\">жалоба<\u002Ftext>\n              <rect x=\"20\" y=\"96\" width=\"280\" height=\"24\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n              <rect x=\"32\" y=\"104\" width=\"130\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n              <rect x=\"240\" y=\"101\" width=\"48\" height=\"14\" rx=\"7\" fill=\"#f2a93b\"/><text x=\"264\" y=\"111\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"8\" fill=\"#fff\">баг<\u002Ftext>\n              <rect x=\"20\" y=\"126\" width=\"280\" height=\"24\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/>\n              <rect x=\"32\" y=\"134\" width=\"160\" height=\"6\" rx=\"3\" fill=\"#e2e6dd\"/>\n              <rect x=\"238\" y=\"131\" width=\"50\" height=\"14\" rx=\"7\" fill=\"#5b9bf0\"/><text x=\"263\" y=\"141\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"8\" fill=\"#fff\">идея<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n          <span style=\"position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:var(--grn-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px\">5<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px\">Автоматический разбор<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)\">Модель убирает персданные, определяет тип, тему и тональность каждого отзыва и группирует их.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 6. Report & export -->\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 18px 22px\">\n        <div style=\"position:relative\">\n          <svg viewBox=\"0 0 320 176\" style=\"width:100%;height:auto;display:block;border-radius:12px\">\n            <rect x=\"1\" y=\"1\" width=\"318\" height=\"174\" rx=\"14\" fill=\"#fff\" stroke=\"#e7ebe3\"/>\n            <circle cx=\"20\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"32\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/><circle cx=\"44\" cy=\"20\" r=\"3\" fill=\"#e7ebe3\"/>\n            <line x1=\"0\" y1=\"34\" x2=\"320\" y2=\"34\" stroke=\"#eef1ea\"/>\n            <text x=\"20\" y=\"56\" font-family=\"'JetBrains Mono',monospace\" font-size=\"10\" fill=\"#7c8274\">FEEDBACK_REPORT<\u002Ftext>\n            <g>\n              <rect x=\"20\" y=\"64\" width=\"82\" height=\"30\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/><text x=\"34\" y=\"84\" font-family=\"'JetBrains Mono',monospace\" font-size=\"13\" font-weight=\"700\" fill=\"#141712\">21%<\u002Ftext>\n              <rect x=\"110\" y=\"64\" width=\"82\" height=\"30\" rx=\"8\" fill=\"#f6f8f3\" stroke=\"#e7ebe3\"/><text x=\"124\" y=\"84\" font-family=\"'JetBrains Mono',monospace\" font-size=\"13\" font-weight=\"700\" fill=\"#141712\">56<\u002Ftext>\n            <\u002Fg>\n            <g>\n              <rect x=\"20\" y=\"104\" width=\"14\" height=\"46\" rx=\"3\" fill=\"#3ddc5a\"/>\n              <rect x=\"42\" y=\"116\" width=\"14\" height=\"34\" rx=\"3\" fill=\"#3ddc5a\" opacity=\".8\"/>\n              <rect x=\"64\" y=\"126\" width=\"14\" height=\"24\" rx=\"3\" fill=\"#3ddc5a\" opacity=\".6\"/>\n              <rect x=\"86\" y=\"134\" width=\"14\" height=\"16\" rx=\"3\" fill=\"#3ddc5a\" opacity=\".45\"/>\n            <\u002Fg>\n            <rect x=\"212\" y=\"104\" width=\"90\" height=\"20\" rx=\"10\" fill=\"#141712\"/><text x=\"257\" y=\"118\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"9\" fill=\"#fff\">Скачать PDF<\u002Ftext>\n            <rect x=\"212\" y=\"130\" width=\"90\" height=\"20\" rx=\"10\" fill=\"#fff\" stroke=\"#e7ebe3\"/><text x=\"257\" y=\"144\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"9\" fill=\"#141712\">Скачать CSV<\u002Ftext>\n          <\u002Fsvg>\n          <span style=\"position:absolute;top:-10px;left:-10px;width:34px;height:34px;border-radius:50%;background:var(--grn-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:14px\">6<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px\">Отчёт и выгрузка<\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)\">Метрики, топ проблем с цитатами и рекомендации — на экране. Скачиваете PDF или размеченную CSV.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PIPELINE -->\n  <div id=\"pipeline\" style=\"max-width:1240px;margin:130px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:56px;max-width:640px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">Как это устроено<\u002Fspan>\n      <h2 style=\"margin:0;font-size:36px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Шесть шагов от файла до решения<\u002Fh2>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.55;color:var(--ink2)\">Этот инструмент закрывает полный цикл работы с обратной связью — от сырой выгрузки до приоритизированного списка задач — и возвращает продакту главное: время и ясную картину того, что важно для пользователей.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--ink)\">1<\u002Fdiv>\n        <div style=\"padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Загрузка выгрузки<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#f0f1ec;color:var(--ink2)\">СКРИПТ PYTHON<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55\">XLSX из UX-feedback — прямо в браузере. Приложение само находит нужные колонки, даже если структура выгрузки немного отличается.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--ink)\">2<\u002Fdiv>\n        <div style=\"padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Удаление персональных данных<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#f0f1ec;color:var(--ink2)\"><span style=\"letter-spacing: 0.63px;\">скрипт PYTHON<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55\">Идентификаторы и номера заказов удаляются до того, как что-либо уходит модели.&nbsp;<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--ink)\">3<\u002Fdiv>\n        <div style=\"padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Классификация отзыва<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(61,220,90,.16);color:var(--grn-deep)\">QWEN 3.5<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55\">Тип (баг, жалоба, идея, похвала), тема и тональность — для каждого содержательного отзыва. Пустые отзывы не тратят ресурсы.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--ink)\">4<\u002Fdiv>\n        <div style=\"padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Кластеризация и приоритеты<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#f0f1ec;color:var(--ink2)\">TF-IDF<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55\">Жалобы и баги группируются по теме, сортируются по частоте. Для каждой темы код через TF-IDF находит самую показательную цитату.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--line)\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--ink)\">5<\u002Fdiv>\n        <div style=\"padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Рекомендации<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(61,220,90,.16);color:var(--grn-deep)\">QWEN 3.5<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55\">Один запрос на топ-проблемах: корень причины, конкретное действие и метрика, по которой проверить результат.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--ink)\">6<\u002Fdiv>\n        <div style=\"padding-top:4px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n            <span style=\"font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Отчёт и выгрузка<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#f0f1ec;color:var(--ink2)\">СКРИПТ PYTHON<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;color:var(--ink2);max-width:640px;line-height:1.55\">Наглядный отчёт на экране, возможность скачатьPDF и размеченная таблица CSV для ручного поиска.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SINGLE REVIEW TRACE -->\n  <div id=\"trace\" style=\"max-width:1240px;margin:130px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:48px;max-width:700px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">Путь одного отзыва<\u002Fspan>\n      <h2 style=\"margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Как обрабатывается каждый отзыв<\u002Fh2>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.55;color:var(--ink2)\">Проследим один реальный отзыв: от строки в выгрузке до конкретного вклада в отчёт. Через эти четыре этапа проходит каждая непустая запись.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- transformation strip -->\n    <div style=\"display:flex;align-items:stretch;gap:10px;flex-wrap:wrap\">\n\n      <!-- stage 1: raw -->\n      <div style=\"flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2);flex:none\">1<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)\">Сырой текст · XLSX<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:var(--ink2)\">«<span style=\"background:rgba(239,106,82,.18);color:#b5460d;border-radius:4px;padding:0 3px\">заказ #48213, курьер Иванов<\u002Fspan> — таймер на подлёт не учитывает светофоры, опаздываю на 1–3 минуты»<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;align-self:center;color:var(--ink3);font-size:20px;font-weight:700\">→<\u002Fdiv>\n\n      <!-- stage 2: cleaned -->\n      <div style=\"flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2);flex:none\">2<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)\">Персданные удалены<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:var(--ink)\">«таймер на подлёт не учитывает светофоры, опаздываю на 1–3 минуты»<\u002Fp>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink3)\"><s>заказ #48213 · курьер Иванов<\u002Fs> — вырезано<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;align-self:center;color:var(--ink3);font-size:20px;font-weight:700\">→<\u002Fdiv>\n\n      <!-- stage 3: classified -->\n      <div style=\"flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"width:24px;height:24px;border-radius:50%;background:rgba(61,220,90,.16);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grn-deep);flex:none\">3<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)\">Классификация · Qwen 3.5<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:11px;color:var(--ink3);width:52px;flex:none\">тип<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(239,106,82,.16);color:#b5460d\">жалоба<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:11px;color:var(--ink3);width:52px;flex:none\">тема<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:#f0f1ec;color:var(--ink2)\">Таймеры<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:11px;color:var(--ink3);width:52px;flex:none\">тон<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(239,106,82,.16);color:#b5460d\">негатив<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;align-self:center;color:var(--ink3);font-size:20px;font-weight:700\">→<\u002Fdiv>\n\n      <!-- stage 4: clustered -->\n      <div style=\"flex:1;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2);flex:none\">4<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)\">Кластеризация · TF-IDF<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><b style=\"font-size:14px;color:var(--ink)\">Кластер «Таймеры»<\u002Fb><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3)\">×75<\u002Fspan><\u002Fdiv>\n        <span style=\"display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(61,220,90,.16);color:var(--grn-deep)\">★ выбран как цитата темы<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- contribution -->\n    <div style=\"margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:30px 32px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:22px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)\">Вклад этого отзыва в итоговый отчёт<\u002Fspan>\n        <span style=\"height:1px;flex:1;background:var(--line)\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--ink)\">+1<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45\">к общему счётчику — <b style=\"color:var(--ink)\">1 733<\u002Fb> отзыва<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--complaint)\">+1<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45\">к доле негатива — <b style=\"color:var(--ink)\">21%<\u002Fb> по кампании<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:var(--ink)\">+1<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45\">к теме «Таймеры» → <b style=\"color:var(--ink)\">топ-1<\u002Fb> проблема<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;color:var(--grn-deep)\">→ рекомендация<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.45\">тема ушла в запрос модели, приоритет высокий<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:20px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink3)\">Так работает каждая запись: одна цифра в метрике, один голос в теме и, если отзыв самый показательный, — цитата в отчёте. Пустые отзывы отсеиваются и в статистику не идут.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- REPORT MOCK -->\n  <div id=\"mock\" style=\"max-width:1240px;margin:130px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:44px;max-width:640px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">Что получает продакт<\u002Fspan>\n      <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Отчёт: классификация, настроение, статистика<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:var(--ink2)\">Ниже — фрагмент реального формата отчёта: ключевые метрики, топ проблем с цитатами и рекомендация с корнем причины и способом проверки.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--paper);border-radius:20px;padding:32px\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:24px\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:var(--line)\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:var(--line)\"><\u002Fspan>\n        <span style=\"width:9px;height:9px;border-radius:50%;background:var(--line)\"><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3);margin-left:6px\">feedback_report — предпросмотр<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px\">\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center\">\n          <div style=\"font-size:27px;font-weight:800;color:var(--ink)\">1 733<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--ink3);margin-top:2px\">всего отзывов<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center\">\n          <div style=\"font-size:27px;font-weight:800;color:var(--ink)\">21%<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--ink3);margin-top:2px\">доля негатива<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center\">\n          <div style=\"font-size:27px;font-weight:800;color:var(--ink)\">56<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--ink3);margin-top:2px\">багов найдено<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px\">\n          <h4 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)\">Топ проблем — по частоте<\u002Fh4>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px\"><b style=\"font-size:14.5px;color:var(--ink)\">Таймеры<\u002Fb><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3)\">75 упоминаний<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:12.5px;color:var(--ink2);font-style:italic;border-left:2px solid var(--line);padding-left:10px;line-height:1.5\">«таймер на подлёт не учитывает светофоры — опаздываю на 1–3 минуты каждый раз»<\u002Fp>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 5px\"><b style=\"font-size:14.5px;color:var(--ink)\">Геолокация<\u002Fb><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3)\">28 упоминаний<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-size:12.5px;color:var(--ink2);font-style:italic;border-left:2px solid var(--line);padding-left:10px;line-height:1.5\">«приложение пишет, что я далеко, хотя стою у двери получателя»<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px\">\n          <h4 style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)\">Рекомендация<\u002Fh4>\n          <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;background:rgba(239,106,82,.14);color:#b5460d;margin-bottom:12px\">приоритет: высокий<\u002Fspan>\n          <div style=\"font-size:12.5px;margin-bottom:8px;line-height:1.55;color:var(--ink2)\"><b style=\"color:var(--ink)\">Корень:<\u002Fb> жёсткий радиус геозоны + дрейф GPS в плотной застройке<\u002Fdiv>\n          <div style=\"font-size:12.5px;margin-bottom:8px;line-height:1.55;color:var(--ink2)\"><b style=\"color:var(--ink)\">Что сделать:<\u002Fb> увеличить радиус подтверждения и добавить ручной fallback<\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.55;color:var(--ink2)\"><b style=\"color:var(--ink)\">Как проверить:<\u002Fb> доля заказов с ≥2 попытками смены статуса «на месте»<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- VALUES -->\n  <div style=\"max-width:1240px;margin:130px auto 0;padding:0 40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:44px;max-width:640px\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grn-deep)\">Что это даёт продакту<\u002Fspan>\n      <h2 style=\"margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Не общие впечатления — решения на данных<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden\">\n      <div style=\"background:#fff;padding:30px 28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--grn-deep);margin-bottom:14px\">01<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Экономия времени<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Часы ручного чтения превращаются в минуты. Картина готова сразу.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;padding:30px 28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--grn-deep);margin-bottom:14px\">02<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Ничего не теряется<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Каждый отзыв классифицирован — баги и идеи не тонут в потоке.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;padding:30px 28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--grn-deep);margin-bottom:14px\">03<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Решения на данных<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Видно, какая проблема самая массовая и куда движется настроение.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;padding:30px 28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--grn-deep);margin-bottom:14px\">04<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Готово к работе<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Топ проблем с цитатами и рекомендациями — сразу в бэклог или на синк.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;padding:30px 28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--grn-deep);margin-bottom:14px\">05<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Безопасность данных<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Персданные удаляются до обработки. Модель — внутренняя, наружу ничего не уходит.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;padding:30px 28px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--grn-deep);margin-bottom:14px\">06<\u002Fdiv>\n        <h3 style=\"margin:0 0 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)\">Воспроизводимость<\u002Fh3>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink2)\">Один и тот же процесс для каждой выгрузки — отчёты сопоставимы между собой.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CLOSING CTA -->\n  <div id=\"closing\" style=\"max-width:1240px;margin:120px auto 0;padding:0 40px\">\n    <div style=\"border-radius:28px;background:linear-gradient(135deg, rgba(61,220,90,.16), rgba(31,138,58,.10));border:1px solid var(--line);padding:56px 60px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap\">\n      <div style=\"max-width:460px\">\n        <h2 style=\"margin:0 0 10px;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Хотите разобрать свою выгрузку?<\u002Fh2>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.55;color:var(--ink2)\"><br><\u002Fp>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink3);margin-top:18px\">Катя Барсукова · Менеджер продукта направления ПД&nbsp;<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n        <a href=\"http://10.18.64.132:7860/\" target=\"_blank\" rel=\"noopener\" style=\"border:none;background:var(--ink);color:#fff;font-size:16px;font-weight:700;padding:16px 30px;border-radius:100px;cursor:pointer;text-decoration:none;white-space:nowrap\">Попробовать<\u002Fa>\n        <a href=\"https://wiki.sbmt.io/pages/viewpage.action?pageId=3528437091\" target=\"_blank\" rel=\"noopener\" style=\"border:2px solid rgba(20,23,18,.18);background:transparent;color:var(--ink);font-size:16px;font-weight:700;padding:14px 28px;border-radius:100px;cursor:pointer;text-decoration:none;white-space:nowrap\">Установить себе<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"max-width:1240px;margin:0 auto;padding:56px 40px 60px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n    <span style=\"font-size:13px;color:var(--ink3)\">Анализатор обратной связи · внутренний инструмент команды Шоппера<\u002Fspan>\n    <a href=\"#top\" style=\"font-size:13px;color:var(--ink3);text-decoration:none\">Наверх ↑<\u002Fa>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  pool = [\n    {text:\"таймер до точки не учитывает светофоры, опаздываю на 1–3 минуты\", type:\"complaint\"},\n    {text:\"сделайте кнопку быстрого доступа к текущему заказу\", type:\"idea\"},\n    {text:\"приложение виснет, когда переключаюсь с VPN на обычную сеть\", type:\"bug\"},\n    {text:\"спасибо, стало намного удобнее принимать заказы\", type:\"praise\"},\n    {text:\"GPS считает, что я далеко, хотя стою у двери получателя\", type:\"complaint\"},\n    {text:\"не сканируется честный знак с некоторых бутылок\", type:\"bug\"},\n    {text:\"было бы удобно видеть маршрут сразу на двух заказах\", type:\"idea\"},\n    {text:\"наконец увеличили радиус отметки «на месте», работает отлично\", type:\"praise\"},\n    {text:\"штрафы начисляются, а объяснения в приложении нет\", type:\"complaint\"},\n    {text:\"после обновления вылетает при открытии карты\", type:\"bug\"},\n  ];\n  poolIdx = 5;\n  nextId = 5;\n\n  state = {\n    incoming: [],\n    taggingId: null,\n    counts: { bug: 0, idea: 0, complaint: 0, praise: 0 },\n    pulseType: null,\n  };\n\n  componentDidMount() {\n    const seeded = this.pool.slice(0, 5).map((it, i) => ({ ...it, id: i }));\n    this.setState({ incoming: seeded });\n\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) {\n      this.setState({ counts: { bug: 9, idea: 14, complaint: 22, praise: 31 } });\n      return;\n    }\n    this._timer = setInterval(() => this.tick(), 2000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._timer);\n  }\n\n  nextItem() {\n    const item = this.pool[this.poolIdx % this.pool.length];\n    this.poolIdx++;\n    const id = this.nextId++;\n    return { ...item, id };\n  }\n\n  tick() {\n    this.setState(s => {\n      const first = s.incoming[0];\n      if (!first) return null;\n      return { taggingId: first.id };\n    });\n\n    setTimeout(() => {\n      this.setState(s => {\n        const first = s.incoming[0];\n        if (!first) return null;\n        const rest = s.incoming.slice(1);\n        rest.push(this.nextItem());\n        const counts = { ...s.counts, [first.type]: s.counts[first.type] + 1 };\n        return { incoming: rest, taggingId: null, counts, pulseType: first.type };\n      });\n      setTimeout(() => this.setState({ pulseType: null }), 320);\n    }, 480);\n  }\n\n  renderVals() {\n    const tagMeta = {\n      bug: { label: 'баг', color: 'var(--bug)' },\n      idea: { label: 'идея', color: 'var(--idea)' },\n      complaint: { label: 'жалоба', color: 'var(--complaint)' },\n      praise: { label: 'похвала', color: 'var(--praise)' },\n    };\n\n    const bucketDefs = ['bug', 'idea', 'complaint', 'praise'];\n    const buckets = bucketDefs.map(type => ({\n      type,\n      label: tagMeta[type].label,\n      color: tagMeta[type].color,\n      count: this.state.counts[type],\n      chips: Array.from({ length: Math.min(this.state.counts[type], 24) }),\n      glow: this.state.pulseType === type ? `0 0 0 3px ${tagMeta[type].color}` : 'none',\n    }));\n\n    const incoming = this.state.incoming.map(it => {\n      const tagging = this.state.taggingId === it.id;\n      return {\n        ...it,\n        tagging,\n        tagLabel: tagMeta[it.type].label,\n        tagColor: tagMeta[it.type].color,\n        borderColor: tagging ? tagMeta[it.type].color : 'var(--line)',\n        textColor: tagging ? 'var(--ink)' : 'var(--ink2)',\n      };\n    });\n\n    return { incoming, buckets };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
